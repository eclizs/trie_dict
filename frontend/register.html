<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EffortList</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">

  <main class="auth-shell">
    <a class="auth-back" href="/" aria-label="Return to dictionary">← Back to dictionary</a>

    <section class="auth-card" aria-labelledby="auth-title">
      <p class="auth-eyebrow">Make it yours</p>
      <h1 id="auth-title">Create an account</h1>
      <p class="auth-intro">Your current guest words will be saved to your new account.</p>

      <form class="auth-form" id="auth-form" data-mode="register" novalidate>
        <div class="auth-field">
          <label for="email">Email</label>
          <input
            class="text-input"
            id="email"
            name="email"
            type="email"
            inputmode="email"
            autocomplete="email"
            maxlength="100"
            placeholder="you@example.com"
            required
            autofocus
          >
        </div>

        <div class="auth-field">
          <label for="password">Password</label>
          <div class="password-field">
            <input
              class="text-input"
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              maxlength="100"
              placeholder="At least 8 characters"
              aria-describedby="password-hint"
              required
            >
            <button class="password-toggle" type="button" aria-label="Show passwords">Show</button>
          </div>
          <p class="field-hint" id="password-hint">Use 8–100 characters.</p>
        </div>

        <div class="auth-field">
          <label for="password-confirmation">Confirm password</label>
          <input
            class="text-input"
            id="password-confirmation"
            name="password_confirmation"
            type="password"
            autocomplete="new-password"
            minlength="8"
            maxlength="100"
            placeholder="Repeat your password"
            required
          >
        </div>

        <button class="action-btn auth-submit" type="submit">Create account</button>
        <p class="status-msg auth-status" id="auth-status" role="status" aria-live="polite"></p>
      </form>

      <p class="auth-switch">Already registered? <a href="/login">Log in</a></p>
    </section>
  </main>

  <script type="module" src="/static/js/pages/auth.js?v=1"></script>
</body>
</html>
